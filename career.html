    <h1>Nine years, four cities, over a million downloads</h1>
    <p><a href="/dipesh-gurav-cv.pdf">Download the PDF CV</a></p>
    <h2>Lead Product Designer, TaskUs · Global BPO · Remote (2021 to 2026)</h2>
    <p>I was the founding and only designer on TaskUs&#x27;s Digital IT team. Every product we built was multi-tenant, sold to client companies on subscription, and used by around 35,000 people a day across 14 countries; around 20 of them went live. I designed for two very different audiences: agents using AI during live customer calls, and the administrators configuring the systems behind them. My first job was in a call centre, so for the agent tools, I used to be the user.</p>
    <p>TaskGPT, an AI suite for agents on live customer calls, working across OpenAI, PaLM 2 and LLaMA. Much of it ran as a Chrome extension inside the tool agents already used, so nobody had to switch windows mid-call. I also designed how we measured it: usage, answer quality, token cost and agent feedback. Call-handling time and operational costs each fell 20%, and moving it behind an encrypted layer solved the privacy problem.</p>
    <p>EvaluateUs, where an AI scored hiring, coaching and training assessments and one dashboard served three people. The candidate wanted to know how they did, the assessor needed to trust the AI&#x27;s score enough to stand behind it, and the manager wanted to know if it was helping the team. I designed each view around that person&#x27;s next decision. Accuracy rose 17%.</p>
    <p>LevelUp, gamification. Managers set targets, challenges and rewards; agents play as their own 3D characters on live leaderboards, built in Three.js. Everyone who takes part wins something, and the best players go into a hall of fame. It was the first gamification work at TaskUs, became the company standard, and was showcased at AWS Summit London 2025.</p>
    <p>AutoQA, automated review of agent calls and my last product at TaskUs. The first build surfaced insight but didn&#x27;t help anyone act, so I held it to its own goal: getting the agents with the most flagged calls into training and one-to-ones. I wrote a UX review, then worked with the SVP, director and development manager to break the fixes into small steps, cutting what phase one didn&#x27;t need to protect a three-month timeline. AI hunted edge cases; my review began where it ran out.</p>
    <p>Maestro, an AI assistant inside Google Chat. Team leads asked plain questions, like who was late on shift or which agent had the most flagged calls, and got a summary, charts and a next action such as booking coaching, instead of logging into several reporting tools. I took it from proof of concept to product and demoed it to clients alongside VPs and directors.</p>
    <p>Design system. I extended TaskUs&#x27;s global foundation across around 20 shipped products, adding a component layer for TaskGPT&#x27;s multi-tenant admin and a separate theme so EvaluateUs could be sold to external clients. Mobile and web stayed consistent across 14 countries, built to WCAG 2.2 AA rather than patched afterwards. As the only designer, the system was also the only way to scale myself.</p>
    <p>AI in the workflow. Claude connected to Figma, Claude Code, Cursor, Figma Make, v0 and Lovable let me build several UX directions in parallel and prototype in code, which surfaced edge cases and let me test a mental model before a stakeholder review instead of after one.</p>
    <h2>Product Designer, Mindefy Technologies · Indore, India (2017 to 2021)</h2>
    <p>I joined Mindefy as an intern and became its sole designer. At Mindefy, I designed products across digital wellbeing, finance, e-commerce, streaming and mentorship. This was where I developed my belief that good design is not just about simplifying screens; it is about understanding what people need emotionally, culturally and behaviourally.</p>
    <p>Designed YourHour, a digital wellbeing app that reached more than 1 million downloads, with 70,000+ reviews, a 4.6-star rating and support for 22 languages. Based on more than 300 research sessions, the experience encouraged healthier digital habits through compassionate, non-punitive interventions.</p>
    <p>Redesigned JEGO, a video streaming, wellbeing and mentorship platform with an RTL-first approach shaped around Gulf cultural contexts. Usability satisfaction increased by 25%.</p>
    <p>EarlyFoods, food for expecting mothers and young children. The analytics and the founder both pointed at price; heatmaps and a survey with nearly 400 customer replies pointed at trust. I rebuilt the store around sourcing and certification before price, fixed buttons parents couldn&#x27;t find and age filters that didn&#x27;t match how they shop, and made reordering easy. Sales rose 33% within two months.</p>
    <p>GreenBill, paperless receipts and invoicing across four apps: one for shoppers, a web point of sale and a mobile app for merchants, and an admin console. Picture a shopkeeper ringing up a sale on their phone while the owner watches sales across every branch. The usability testing toolkit I built caught 85% of issues before development.</p>
    <p>Kidster, a digital school diary for attendance, homework, parent-teacher meetings and notices. It found traction but not enough money, and the company rightly moved its focus to YourHour. It taught me to ask the money question as early as the user question.</p>
    <p>YourSlice, a companion app to YourHour for tracking and managing specific habits, built on the same design system so the two felt like one family.</p>
    <p>Hired and mentored junior and mid-level designers, for client products and for Mindefy&#x27;s own.</p>
    <h2>Selected projects, Fintech · Developer tools · AI</h2>
    <p>Repos Pay, Repos Energy&#x27;s credit platform for fuel delivery. One app let fuel pump owners extend credit; the other let businesses apply for it and draw it down. Two sides trusting one system for opposite reasons.</p>
    <p>ZuQA, API testing tool. Postman had no low-code API testing at the time; a friend was building the concept and I joined as design hand. Progressive disclosure cut cognitive load and developer onboarding time by 15%.</p>
    <p>Job App Assistant, a live AI web app that I designed, coded and deployed alone in one session, with Node.js and the Claude API.</p>
