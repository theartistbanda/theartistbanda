    <h1>Designing for the humans behind the pixels</h1>
    <h2>I became a designer because technology is supposed to make life easier</h2>
    <p>I have spent nine years in product design, and I love what I do: solving problems in human-computer interaction. I grew up watching technology promise to make life easier, then complicate it. Forms that run too long, menus that hide the one thing you need, apps that help and frustrate in equal measure. Closing that gap is the work I thrive on.</p><p>For most of my career I have been an individual contributor on projects with no clear brief. There was always an idea, a problem or a gap, and how and where to start was mine to decide. I preferred it that way.</p><p>Screens are just a medium. How a product feels comes from the person&#x27;s experience, and the screen comes later. Understanding people and their behaviour comes first, whether I am designing an AI tool for operators on live calls, a wellbeing app, or a logo that ended up on Indian-made goods across the country.</p><p>The work has taken me to a billion-person market in India, to Gulf users who read right to left, and to enterprise teams in 14 countries. YourHour, a wellbeing app I designed, ships in 22 languages and has passed a million downloads. Every one of those audiences taught me that &quot;intuitive&quot; carries a quiet question, <em>intuitive for whom</em>. Knowing beats assuming, so the answer comes from sitting alongside users, not from a report.</p><p>The simplest things are the hardest to create. Ask a room full of people what a product should have and they will list dozens of features. Ask them to prune the list and the room goes quiet. Minimalism inspires me, and my layouts leave no room for unnecessary friction: clean on the surface, built cleanly behind the scenes.</p><p>Away from work I read, and I lose hours to brain games. Both keep me practised at the thing design needs most: finding the pattern under the noise.</p>
    <h2>Six beliefs that decide every design call</h2>
    <ol><li><strong>If it confuses you, it is the design’s fault</strong>: Technology is supposed to make life easier. When people struggle, the design failed, and that is always fixable.</li><li><strong>Behaviour first, visuals second</strong>: Stunning interfaces that change nothing are decoration. Start with: what will the user do differently on Tuesday?</li><li><strong>Cross-cultural design is a skill, not a checklist</strong>: Intuitive is local. Shipping for India, the Gulf and enterprise teams in 14 countries taught me: empathy is not assumed, it is researched.</li><li><strong>Emotion is a design material</strong>: The gap between apps people try once and apps they use daily is almost always emotional. Trust, delight, belonging: architectable.</li><li><strong>Measure what you made</strong>: Every project ties to a metric: 20% less call-handling time, 17% more accurate assessments, 33% more sales within two months. Good design earns its seat at the business table.</li><li><strong>Simplicity is deeper understanding, not fewer features</strong>: Close the gap between complexity in the world and clarity in the mind. That is the entire job.</li></ol>
    <h2 id="origin">An open competition, a golden bird, a mark India picked up</h2>
    <p>I entered an open MyGov competition to design a mark for the Aatmnirbhar Bharat campaign: the Indian tricolour and Ashok Chakra fused with a golden bird, a reference to the country once being called sone ki chidiya. The competition was never formally decided. The mark was taken up by the PM SVANidhi scheme and used by manufacturers marking Indian-made goods, without credit.</p>
    <ul><li>1M+: Downloads · YourHour</li><li>20%: Call-handling time and cost cut</li><li>17%: Campaign knowledge accuracy</li><li>33%: Sales in two months</li></ul>
